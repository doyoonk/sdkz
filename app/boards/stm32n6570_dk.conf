CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_RUNTIME=y

CONFIG_DMA=y
CONFIG_PWM=y
CONFIG_PWM_STM32=y
CONFIG_STM32_BACKUP_PROTECTION=y

# On-chip temperature and VBAT sensors
CONFIG_SENSOR=y
CONFIG_STM32N6_DTS=y
CONFIG_STM32_VBAT=y
CONFIG_SENSOR_SHELL=y
# Keep sensor shell RTIO buffers in the application's AXISRAM.
CONFIG_RTIO_BLOCK_POOL_PLACEMENT_DEFAULT=y
CONFIG_RTIO_SQE_PLACEMENT_DEFAULT=y
# Keep unrelated sensors disabled when enabling the sensor subsystem.
CONFIG_EXAMPLE_SENSOR=n
CONFIG_VL53L5CX=n

# SPI
CONFIG_SPI=y

# memmory map
CONFIG_FLASH=y
#CONFIG_STM32_MEMMAP=y
CONFIG_FLASH_STM32_NOR_MEMMAP=y
#CONFIG_STM32_XSPIM=y

# RTC
CONFIG_RTC=y
CONFIG_RTC_CALIBRATION=n

CONFIG_ENTROPY_STM32_RNG=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_RETENTION=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION_BOOTLOADER_INFO_OUTPUT_FUNCTION=y

# RAM load
CONFIG_XIP=n
CONFIG_IS_BOOTLOADER=n
CONFIG_MCUBOOT_BOOTLOADER_MODE_RAM_LOAD=y

# boot loader
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="${WEST_TOPDIR}/etc/ssl/certs/mcuboot_sign-rsa-2048.pem"

CONFIG_CRC_HW_HANDLER=n

CONFIG_VIDEO_WIDTH=800
CONFIG_VIDEO_HEIGHT=480
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=n
# Keep static LVGL buffers outside the PSRAM region registered as a shared heap.
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="PSRAM_DISPLAY"
CONFIG_APP_CAMERA_FRAME_CAPACITY=4194304
CONFIG_USE_STM32_MW_ISP=y
CONFIG_APP_CAMERA_CAPTURE=y
CONFIG_ZXC=y
CONFIG_ZXC_USE_HEAP=y
CONFIG_APP_CAMERA_BARCODE=y

#CONFIG_DEBUG_OPTIMIZATIONS=y
#CONFIG_PWM_LOG_LEVEL_DBG=y
#CONFIG_FLASH_LOG_LEVEL_DBG=y
